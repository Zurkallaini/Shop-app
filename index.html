<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shop Inventory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', system-ui, sans-serif; }
  body { background:#0b1a3a; color:#fff; min-height:100vh; }
  #authScreen { display:flex; min-height:100vh; }
  .left-side { flex:1; padding:60px; display:flex; flex-direction:column; justify-content:center; background:#0b1a3a; }
  .left-side h1 { font-size:36px; margin-bottom:40px; font-weight:600; }
  .form-group { margin-bottom:20px; }
  .form-group label { display:block; font-size:13px; color:#cbd5e1; margin-bottom:8px; }
  .form-group input,.form-group select { width:100%; background:transparent; border:none; border-bottom:2px solid #334155; padding:10px 0; color:#fff; font-size:15px; outline:none; }
  .form-group input:focus,.form-group select:focus { border-bottom-color:#3b82f6; }
  .btn { width:100%; padding:14px; background:#3b82f6; border:none; border-radius:8px; color:#fff; font-weight:600; cursor:pointer; margin-top:20px; font-size:15px; }
  .btn:hover { background:#2563eb; }
  .switch-text { text-align:center; margin-top:20px; color:#cbd5e1; font-size:14px; }
  .switch-text a { color:#3b82f6; cursor:pointer; text-decoration:none; }
  .forgot { text-align:right; margin-top:10px; font-size:13px; }
  .forgot a { color:#cbd5e1; cursor:pointer; text-decoration:none; }
  .right-side { flex:1; background:#1e40af; display:flex; align-items:center; justify-content:center; }
  .right-side img { max-width:70%; }
  #signupForm { display:none; }
  #dashboardScreen { display:none; background:#0f1117; color:#e4e6eb; min-height:100vh; }
  .sidebar { width:240px; background:#1a1d24; padding:24px 16px; border-right:1px solid #2a2e37; position:fixed; height:100vh; }
  .sidebar h2 { font-size:18px; margin-bottom:32px; color:#fff; }
  .nav-item { padding:12px 16px; margin-bottom:8px; border-radius:8px; cursor:pointer; color:#9ca3af; }
  .nav-item:hover, .nav-item.active { background:#2a2e37; color:#fff; }
  .main { margin-left:240px; padding:32px; flex:1; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; }
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin-bottom:32px; }
  .card { background:#1a1d24; padding:20px; border-radius:12px; border:1px solid #2a2e37; }
  .card-label { font-size:13px; color:#9ca3af; margin-bottom:8px; }
  .card-value { font-size:28px; font-weight:600; color:#fff; }
  .table-container { background:#1a1d24; border-radius:12px; border:1px solid #2a2e37; overflow:hidden; }
  .dash-select, .dash-btn { background:#2a2e37; border:1px solid #3a3f4b; color:#fff; padding:10px 16px; border-radius:8px; outline:none; }
  .dash-btn { background:#3b82f6; border:none; cursor:pointer; font-weight:500; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:16px 20px; text-align:left; border-bottom:1px solid #2a2e37; }
  th { color:#9ca3af; font-weight:500; font-size:13px; text-transform:uppercase; }
  @media(max-width:900px){ .right-side { display:none; } .left-side { padding:40px 30px; } }
  @media(max-width:768px){ .sidebar { display:none; } .main { margin-left:0; padding:20px; } }
</style>
</head>
<body>

<div id="authScreen">
  <div class="left-side">
    <div id="loginForm">
      <h1>Login</h1>
      <div class="form-group">
        <label>Enter your email</label>
        <input type="email" id="loginEmail" placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Enter your password</label>
        <input type="password" id="loginPassword" placeholder="••••">
      </div>
      <div class="forgot"><a onclick="forgotPassword()">Forgot Password?</a></div>
      <button class="btn" onclick="login()">Login</button>
      <div class="switch-text">Don't have an account? <a onclick="toggleForm()">Sign Up</a></div>
    </div>

    <div id="signupForm">
      <h1>Registration</h1>
      <div class="form-group"><label>First Name</label><input type="text" id="firstName" placeholder="John"></div>
      <div class="form-group"><label>Surname</label><input type="text" id="lastName" placeholder="Doe"></div>
      <div class="form-group"><label>Other Name <span style="color:#64748b;">(optional)</span></label><input type="text" id="otherName" placeholder="Middle name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="signupEmail" placeholder="email@example.com"></div>
      <div class="form-group"><label>Country</label>
        <select id="country">
          <option value="">Select Country</option>
          <option value="Nigeria">Nigeria</option>
          <option value="Morocco">Morocco</option>
          <option value="USA">USA</option>
        </select>
      </div>
      <div class="form-group"><label>State</label>
        <select id="state">
          <option value="">Select State</option>
          <option value="Lagos">Lagos</option>
          <option value="Casablanca">Casablanca</option>
        </select>
      </div>
      <div class="form-group"><label>Password</label><input type="password" id="signupPassword" placeholder="••••"></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" placeholder="••••"></div>
      <button class="btn" onclick="signup()">Sign Up</button>
      <div class="switch-text">Already have an account? <a onclick="toggleForm()">Login</a></div>
    </div>
  </div>
  <div class="right-side">
    <img src="https://i.ibb.co/6yQZk3b/illustration.png" alt="Illustration">
  </div>
</div>

<div id="dashboardScreen">
  <div class="sidebar">
    <h2>📦 My Shop</h2>
    <div class="nav-item active">📊 Dashboard</div>
    <div class="nav-item" onclick="logout()">🚪 Logout</div>
  </div>
  <div class="main">
    <div class="header">
      <h1>Dashboard</h1>
      <div style="display:flex; gap:12px; align-items:center;">
        <select id="currencySelect" class="dash-select">
          <option value="$">$ USD</option>
          <option value="€">€ EUR</option>
          <option value="₦">₦ NGN</option>
          <option value="MAD">MAD</option>
        </select>
        <button class="dash-btn" onclick="alert('Add Product Modal')">+ Add Product</button>
      </div>
    </div>
    <div class="stats-grid">
      <div class="card"><div class="card-label">Total Products</div><div class="card-value" id="totalProducts">0</div></div>
      <div class="card"><div class="card-label">Stock Value</div><div class="card-value" id="stockValue">$0</div></div>
      <div class="card"><div class="card-label">Low Stock</div><div class="card-value" id="lowStock">0</div></div>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>Product</th><th>Barcode</th><th>Stock</th><th>Buy Price</th><th>Sell Price</th></tr></thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hyhbhtiuwzzrkuiowecg.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_zRWkJ-_vCtcImHv6jfsEuw_w7Xyb6FV'

const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
let currentCurrency = '$'

_supabase.auth.getSession().then(({ data: { session } }) => {
  if(session) showDashboard()
})

function toggleForm(){
  const login = document.getElementById('loginForm')
  const signup = document.getElementById('signupForm')
  login.style.display = login.style.display === 'none'? 'block' : 'none'
  signup.style.display = signup.style.display === 'none'? 'block' : 'none'
}

async function signup(){
  const email = document.getElementById('signupEmail').value.trim()
  const password = document.getElementById('signupPassword').value
  const confirmPassword = document.getElementById('confirmPassword').value

  if(password !== confirmPassword) return alert("Passwords don't match")
  if(!email || !password) return alert("Email and password are required")

  const { error } = await _supabase.auth.signUp({
    email, 
    password,
    options: { 
      data: { 
        first_name: document.getElementById('firstName').value.trim(),
        last_name: document.getElementById('lastName').value.trim(),
        other_name: document.getElementById('otherName').value.trim(),
        country: document.getElementById('country').value,
        state: document.getElementById('state').value
      } 
    }
  })

  if(error) return alert('Signup Error: ' + error.message)
  alert('Success! Check your email to confirm, then login.')
  toggleForm()
}

async function login(){
  const email = document.getElementById('loginEmail').value.trim()
  const password = document.getElementById('loginPassword').value
  const { error } = await _supabase.auth.signInWithPassword({ email, password })
  if(error) return alert('Login Error: ' + error.message)
  showDashboard()
}

async function forgotPassword(){
  const email = prompt("Enter your email to reset password:")
  if(!email) return
  const { error } = await _supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin })
  alert(error ? 'Error: ' + error.message : 'Password reset link sent!')
}

async function logout(){
  await _supabase.auth.signOut()
  document.getElementById('dashboardScreen').style.display = 'none'
  document.getElementById('authScreen').style.display = 'flex'
}

function showDashboard(){
  document.getElementById('authScreen').style.display = 'none'
  document.getElementById('dashboardScreen').style.display = 'flex'
  loadProducts()
}

document.getElementById('currencySelect').addEventListener('change', (e) => {
  currentCurrency = e.target.value
  loadProducts()
})

async function loadProducts() {
  const { data, error } = await _supabase.from('products').select('*')
  if(error) return console.error(error)
  
  const totalValue = data.reduce((sum, p) => sum + ((p.buy_price || 0) * (p.stock || 0)), 0)
  const lowStockCount = data.filter(p => (p.stock || 0) < 10).length
  
  document.getElementById('totalProducts').textContent = data.length
  document.getElementById('stockValue').textContent = currentCurrency + totalValue.toFixed(2)
  document.getElementById('lowStock').textContent = lowStockCount
  
  document.getElementById('productTable').innerHTML = data.map(p => `
    <tr>
      <td>${p.name || ''}</td>
      <td>${p.barcode || ''}</td>
      <td>${p.stock || 0}</td>
      <td>${currentCurrency}${p.buy_price || 0}</td>
      <td>${currentCurrency}${p.sell_price || 0}</td>
    </tr>
  `).join('')
}
</script>
</body>
   </html>
