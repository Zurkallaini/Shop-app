<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shop Inventory</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://hybhbtiuwmzrkuioiwecg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zRWKJ_VctclmHw6JfsEuw_w7Xyb6FV';
window.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
console.log(window.supabase);
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body {
  background: #8a7dff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.wrapper {
  width: 100%;
  max-width: 380px;
  background: white;
  border-radius: 20px;
  padding: 30px 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.wrapper h2 {
  font-size: 28px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 25px;
  color: #1a1a1a;
}
.tab-switch {
  display: flex;
  border: 1px solid #e0e0e0;
  border-radius: 30px;
  overflow: hidden;
  margin-bottom: 25px;
}
.tab-switch button {
  flex: 1;
  padding: 12px;
  border: none;
  background: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  color: #666;
}
.tab-switch button.active {
  background: linear-gradient(90deg, #1e3a8a, #3b82f6);
  color: white;
}
.input-group { margin-bottom: 15px; }
.input-group input {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}
.input-group input:focus { border-color: #3b82f6; }
.btn-primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(90deg, #1e3a8a, #3b82f6);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.switch-link { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
.switch-link a { color: #3b82f6; text-decoration: none; font-weight: 600; cursor: pointer; }
.success-msg { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; display: none; }
.error-msg { color: #dc2626; font-size: 14px; margin-bottom: 10px; text-align: center; }
.hidden { display: none!important; }
.app-container {
  width: 100%;
  max-width: 1100px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.form-grid input {
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  border: 1px solid #eee;
  padding: 12px;
  text-align: left;
}
th { background: #f8f9fa; font-weight: 600; }
.btn {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  margin-right: 5px;
}
.btn-logout { background: #ef4444; color: white; padding: 10px 18px; }
</style>
</head>
<body>

<div id="auth-section" class="wrapper">
  <div id="login-form">
    <h2>Login Form</h2>
    <div class="tab-switch">
      <button class="active" onclick="showLoginTab()">Login</button>
      <button onclick="showSignupTab()">Signup</button>
    </div>
    <div id="login-error" class="error-msg"></div>
    <div class="input-group">
      <input type="email" id="login-email" placeholder="Email Address">
    </div>
    <div class="input-group">
      <input type="password" id="login-password" placeholder="Password">
    </div>
    <button class="btn-primary" onclick="signIn()">Login</button>
    <div class="switch-link">
      Not a member? <a onclick="showSignupTab()">Signup now</a>
    </div>
  </div>

  <div id="signup-form" class="hidden">
    <h2>Signup Form</h2>
    <div class="tab-switch">
      <button onclick="showLoginTab()">Login</button>
      <button class="active">Signup</button>
    </div>
    <div id="register-success" class="success-msg">Registration successful! Please login.</div>
    <div id="register-error" class="error-msg"></div>
    <div class="input-group">
      <input type="email" id="reg-email" placeholder="Email Address">
    </div>
    <div class="input-group">
      <input type="password" id="reg-password" placeholder="Password">
    </div>
    <div class="input-group">
      <input type="password" id="reg-confirm-password" placeholder="Confirm password">
    </div>
    <button class="btn-primary" onclick="signUp()">Signup</button>
  </div>
</div>

<div id="app-section" class="app-container hidden">
  <div class="app-header">
    <h2>My Shop Inventory</h2>
    <button class="btn btn-logout" onclick="signOut()">Logout</button>
  </div>

  <h3>Add New Product</h3>
  <div class="form-grid">
    <input type="text" id="barcode" placeholder="Barcode">
    <input type="text" id="name" placeholder="Product Name">
    <input type="number" id="buy_price" placeholder="Buy Price">
    <input type="number" id="sell_price" placeholder="Sell Price">
    <input type="number" id="stock" placeholder="Initial Stock">
  </div>
  <button class="btn-primary" style="margin-bottom:30px;" onclick="addProduct()">Add Product</button>

  <h3>Products</h3>
  <table id="products-table">
    <thead>
      <tr><th>Name</th><th>Barcode</th><th>Buy</th><th>Sell</th><th>Stock</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>

/* ===== Auth Tabs ===== */
function showLoginTab() {
  document.getElementById('signup-form').classList.add('hidden');
  document.getElementById('login-form').classList.remove('hidden');
}

function showSignupTab() {
  document.getElementById('login-form').classList.add('hidden');
  document.getElementById('signup-form').classList.remove('hidden');
}

/* ===== SIGN UP ===== */
async function signUp() {
  try {
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirmPassword = document.getElementById('reg-confirm-password').value;
    const errorDiv = document.getElementById('register-error');
    const successDiv = document.getElementById('register-success');
    errorDiv.textContent = '';
    successDiv.style.display = 'none';

    if (!email ||!password ||!confirmPassword) {
      errorDiv.textContent = 'All fields are required';
      return;
    }
    if (password!== confirmPassword) {
      errorDiv.textContent = 'Passwords do not match';
      return;
    }

    const { error } = await window.supabase.auth.signUp({ email, password });
    if (error) {
      errorDiv.textContent = error.message;
      return;
    }

    successDiv.style.display = 'block';
    document.getElementById('reg-email').value = '';
    document.getElementById('reg-password').value = '';
    document.getElementById('reg-confirm-password').value = '';
    setTimeout(() => showLoginTab(), 2000);
  } catch (err) {
    alert(err.message);
  }
}

/* ===== LOGIN ===== */
async function signIn() {
  try {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorDiv = document.getElementById('login-error');
    errorDiv.textContent = '';

    const { error } = await window.supabase.auth.signInWithPassword({ email, password });
    if (error) {
      errorDiv.textContent = error.message;
      return;
    }
    checkUser();
  } catch (err) {
    alert(err.message);
  }
}

/* ===== CHECK USER ===== */
async function checkUser() {
  const { data: { user }} = await window.supabase.auth.getUser();
  if (user) {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    loadProducts();
  }
}

/* ===== LOGOUT ===== */
async function signOut() {
  await window.supabase.auth.signOut();
  document.getElementById('app-section').classList.add('hidden');
  document.getElementById('auth-section').classList.remove('hidden');
}

/* ===== ADD PRODUCT ===== */
async function addProduct() {
  const { data: { user }} = await window.supabase.auth.getUser();
  if (!user) return alert('Not logged in');

  const product = {
    user_id: user.id,
    barcode: document.getElementById('barcode').value,
    name: document.getElementById('name').value,
    buy_price: parseFloat(document.getElementById('buy_price').value) || 0,
    sell_price: parseFloat(document.getElementById('sell_price').value) || 0,
    stock: parseInt(document.getElementById('stock').value) || 0
  };

  if (!product.name) return alert('Product name is required');

  const { error } = await window.supabase.from('products').insert([product]);
  if (error) {
    alert('Error: ' + error.message);
    return;
  }

  document.getElementById('barcode').value = '';
  document.getElementById('name').value = '';
  document.getElementById('buy_price').value = '';
  document.getElementById('sell_price').value = '';
  document.getElementById('stock').value = '';

  loadProducts();
  alert('Product added!');
}

/* ===== LOAD PRODUCTS ===== */
async function loadProducts() {
  const { data: { user }} = await window.supabase.auth.getUser();
  if (!user) return;

  const { data, error } = await window.supabase
 .from('products')
 .select('*')
 .eq('user_id', user.id)
 .order('created_at', { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  const tbody = document.querySelector('#products-table tbody');
  tbody.innerHTML = '';
  data.forEach((p) => {
    tbody.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.barcode || ''}</td>
        <td>$${p.buy_price}</td>
        <td>$${p.sell_price}</td>
        <td>${p.stock}</td>
      </tr>
    `;
  });
}

/* ===== START ===== */
checkUser();

</script>
</body>
      </html>
