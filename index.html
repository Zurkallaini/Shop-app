
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Inventory Scanner</title>
<meta name="theme-color" content="#4CAF50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shop Inventory">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
  background: #f5f5f5;
}
.container {
  max-width: 800px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h2, h3 {
  text-align: center;
  margin: 10px 0;
}
.section {
  margin: 20px 0;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fafafa;
}
input, select, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  font-size: 16px;
}
button {
  background: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
button:hover {
  opacity: 0.9;
}
.btn-red { background: #f44336; }
.btn-orange { background: #ff9800; }
.btn-gray { background: #9e9e9e; }
.stats {
  display: flex;
  justify-content: space-around;
  background: #e8f5e9;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 15px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
  font-size: 14px;
}
th {
  background: #4CAF50;
  color: white;
}
</style>
</head>
<body>
<div class="container">
  <h2>Shop Inventory Scanner</h2>
  
  <div class="stats">
    <div>Today<br><strong id="statToday">0</strong></div>
    <div>This Month<br><strong id="statMonth">0</strong></div>
    <div>All Time<br><strong id="statAll">0</strong></div>
  </div>

  <details class="section">
    <summary><strong>Settings & Backup</strong></summary>
    <button onclick="exportJSON()">Export Backup</button>
    <input type="file" id="importFile" accept=".json">
    <button onclick="importJSON()">Import Backup</button>
    <button class="btn-red" onclick="clearData()">Clear All Data</button>
  </details>

  <div class="section">
    <h3>Add/Edit Product</h3>
    <input type="text" id="barcode" placeholder="Barcode / Product ID">
    <input type="text" id="productName" placeholder="Product Name e.g. Coca Cola 500ml">
    <input type="number" id="buyPrice" placeholder="Buying Price">
    <input type="number" id="sellPrice" placeholder="Selling Price">
    <button onclick="saveProduct()">Save Product</button>
  </div>

  <div class="section">
    <h3>Transaction</h3>
    <input type="text" id="transBarcode" placeholder="Barcode">
    <select id="transType">
      <option value="sale">Sale</option>
      <option value="restock">Restock</option>
    </select>
    <input type="number" id="quantity" placeholder="Quantity">
    <button onclick="doRestock()" style="background:#4CAF50;">Restock</button>
    <button class="btn-red" onclick="doSale()">Sell</button>
    <button class="btn-orange" onclick="exportExcel()">Export to Excel</button>
  </div>

  <div class="section">
    <h3>Stock Dashboard</h3>
    <button class="btn-red" onclick="filterStock('all')">All Products</button>
    <button class="btn-gray" onclick="filterStock('low')">Low Stock</button>
    <button class="btn-gray" onclick="filterStock('out')">Out of Stock</button>
    <div id="stockTable"></div>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('products') || '{}');

function saveProduct() {
  const barcode = document.getElementById('barcode').value.trim();
  const name = document.getElementById('productName').value.trim();
  const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
  const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
  
  if (!barcode ||!name) {
    alert('Enter barcode and product name');
    return;
  }
  
  products[barcode] = {name, buy, sell, stock: products[barcode]?.stock || 0};
  localStorage.setItem('products', JSON.stringify(products));
  alert('Product saved');
  updateStats();
  filterStock('all');
}

function doRestock() {
  const barcode = document.getElementById('transBarcode').value.trim();
  const qty = parseInt(document.getElementById('quantity').value) || 0;
  if (!products[barcode]) {
    alert('Product not found');
    return;
  }
  products[barcode].stock += qty;
  localStorage.setItem('products', JSON.stringify(products));
  updateStats();
  filterStock('all');
}

function doSale() {
  const barcode = document.getElementById('transBarcode').value.trim();
  const qty = parseInt(document.getElementById('quantity').value) || 0;
  if (!products[barcode]) {
    alert('Product not found');
    return;
  }
  if (products[barcode].stock < qty) {
    alert('Not enough stock');
    return;
  }
  products[barcode].stock -= qty;
  localStorage.setItem('products', JSON.stringify(products));
  updateStats();
  filterStock('all');
}

function filterStock(type) {
  let html = '<table><tr><th>Product</th><th>Stock</th><th>Buy</th><th>Sell</th><th>Profit</th></tr>';
  for (let barcode in products) {
    const p = products[barcode];
    if (type === 'low' && p.stock > 5) continue;
    if (type === 'out' && p.stock > 0) continue;
    html += `<tr>
      <td>${p.name}</td>
      <td>${p.stock}</td>
      <td>${p.buy}</td>
      <td>${p.sell}</td>
      <td>${(p.sell - p.buy) * p.stock}</td>
    </tr>`;
  }
  html += '</table>';
  document.getElementById('stockTable').innerHTML = html;
}

function updateStats() {
  document.getElementById('statAll').innerText = Object.keys(products).length;
  document.getElementById('statToday').innerText = '0';
  document.getElementById('statMonth').innerText = '0';
}

function exportExcel() {
  let csv = 'Barcode,Name,Stock,Buy,Sell\n';
  for (let barcode in products) {
    const p = products[barcode];
    csv += `${barcode},${p.name},${p.stock},${p.buy},${p.sell}\n`;
  }
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inventory.csv';
  a.click();
}

function exportJSON() {
  const data = JSON.stringify(products);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup.json';
  a.click();
}

function importJSON() {
  const file = document.getElementById('importFile').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    products = JSON.parse(e.target.result);
    localStorage.setItem('products', JSON.stringify(products));
    updateStats();
    filterStock('all');
    alert('Data imported');
  };
  reader.readAsText(file);
}

function clearData() {
  if (confirm('Delete all data?')) {
    products = {};
    localStorage.removeItem('products');
    updateStats();
    filterStock('all');
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

updateStats();
filterStock('all');
</script>
</body>
</html>
